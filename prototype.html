<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLD Forge</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#171717;font:14px Arial,sans-serif}button{cursor:pointer;font:inherit}header{height:70px;border-bottom:1px solid #ddd9d0;background:#f8f7f3;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:9px;background:#191919;color:white;display:grid;place-items:center;font-size:20px}.brand b{display:block}.brand span{font-size:11px;color:#817f79}nav button{border:0;background:transparent;padding:9px 13px;border-radius:8px}nav button:hover{background:#ebe9e2}.wrap{max-width:1180px;margin:auto;padding:50px 24px 80px}.hero{display:grid;grid-template-columns:1.4fr .7fr;gap:60px;padding:35px 0 65px}.eyebrow{font:11px monospace;letter-spacing:.12em;color:#85817a}.hero h1{font-size:58px;line-height:1.02;letter-spacing:-.05em;margin:12px 0}.hero h1 i{font-style:normal;color:#77736c}.lede{font-size:16px;line-height:1.7;color:#68655f;max-width:650px}.primary,.submit{background:#191919;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:700}.loop{border:1px solid #d8d4cc;border-radius:14px;padding:22px;background:#faf9f5}.loop div{padding:14px 0;border-bottom:1px solid #e2dfd8;font-size:13px}.loop div:first-child{border:0;padding-top:0}.stats{border-top:1px solid #d8d4cc;border-bottom:1px solid #d8d4cc;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:65px}.stats div{padding:22px}.stats b{font-size:22px;margin-right:7px}.stats span{font-size:12px;color:#777}.section{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.section h2,.section h1{margin:0;font-size:30px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fbfaf6;border:1px solid #dedbd3;border-radius:13px;padding:21px;min-height:300px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;font-size:11px;color:#888}.diff{font:10px monospace;text-transform:uppercase;padding:5px 8px;border-radius:5px;background:#e8e5dc}.easy{background:#e3eadf}.medium{background:#eee7d5}.hard{background:#eadfdc}.card h3{font-size:22px;margin:22px 0 9px}.card p{font-size:12px;line-height:1.7;color:#706d67}.tags{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:10px;background:#f0eee8;padding:5px 7px;border-radius:4px}.text{border:0;background:transparent;padding:12px 0;font-weight:700;text-align:left}.practice{max-width:1450px;margin:auto;padding:30px}.phead{display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;margin-bottom:24px}.phead>div:nth-child(2){text-align:center}.phead h1{margin:8px 0;font-size:25px}.timer{text-align:right;font:13px monospace}.back{border:0;background:transparent}.workspace{display:grid;grid-template-columns:360px 1fr;gap:18px}.aside,.editor{background:#fbfaf6;border:1px solid #dedbd3;border-radius:12px}.aside{padding:23px;height:calc(100vh - 160px);overflow:auto}.prompt{font-size:13px;line-height:1.7}.aside li{font-size:12px;line-height:1.7;margin:7px 0;color:#666}.hint{margin-top:22px;background:#f1eee5;padding:14px;border-radius:9px;font-size:11px}.hint button{border:0;background:none;text-decoration:underline;font-size:10px;padding:0}.editor{padding:0 24px 25px}.etitle{padding:20px 0 14px;border-bottom:1px solid #e1ded7;display:flex;justify-content:space-between;align-items:center}.etitle b{display:block}.etitle small{color:#888}.field{display:block;margin-top:18px}.field label{font-size:11px;font-weight:bold;display:block;margin-bottom:7px}.field textarea{width:100%;min-height:82px;resize:vertical;border:1px solid #ddd9d0;border-radius:8px;background:#f7f5f0;padding:12px;outline:none;line-height:1.6}.scorehero{display:flex;justify-content:space-between;align-items:center;padding:50px 0;border-bottom:1px solid #ddd9d0}.scorehero h1{font-size:42px;margin:10px 0}.score{font-size:12px;text-align:center}.score b{display:block;font-size:70px}.grid{display:grid;grid-template-columns:1.5fr .7fr;gap:50px;padding-top:30px}.fi{display:flex;gap:13px;border-bottom:1px solid #ddd9d0;padding:17px 0}.sig{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}.pass{background:#e1e9dd}.warn{background:#eee5cf}.critical{background:#ebdeda}.fi p{font-size:12px;color:#666;line-height:1.6}.side{border:1px solid #ddd9d0;border-radius:10px;padding:18px;margin-bottom:14px}.mini{font-size:11px;line-height:1.5;padding:8px 0}.history article{display:grid;grid-template-columns:1fr 100px 90px;align-items:center;border-bottom:1px solid #ddd9d0;padding:18px 4px}.history h3{margin:6px 0}.empty{border:1px dashed #bbb;padding:45px;text-align:center;color:#777;border-radius:12px}@media(max-width:850px){.hero,.cards,.grid,.workspace{grid-template-columns:1fr}.loop{display:none}.stats{grid-template-columns:1fr}.aside{height:auto}.phead{grid-template-columns:1fr auto}.phead>div:nth-child(2){text-align:left}.wrap{padding:35px 18px}.hero h1{font-size:43px}.history article{grid-template-columns:1fr 80px}.history article button{grid-column:1/-1}}
</style></head><body><header><div class="brand"><div class="logo">⌘</div><div><b>LLD Forge</b><span>Practice → design → feedback → repeat</span></div></div><nav><button onclick="home()">Problems</button><button onclick="historyView()">History</button></nav></header><div id="app"></div><script>
const P=[
{id:'parking',title:'Parking Lot',difficulty:'Medium',time:45,tags:['OOP','Strategy','Composition'],prompt:'Design a parking lot that supports multiple floors, spot types, vehicle types, ticketing and fee calculation. Make it possible to add pricing rules without rewriting parking operations.',req:['A vehicle enters and receives a ticket tied to an occupied spot.','Cars, bikes and trucks may require different spot types.','A lot contains multiple floors and each floor owns its spots.','Exit calculates a fee from ticket duration and a configurable pricing policy.','A new pricing policy should not require changes to ParkingLot.'],hints:['Separate parking workflow from pricing.','Think about who owns a spot and who owns a ticket.','Prefer composition when behavior is expected to vary.']},
{id:'elevator',title:'Elevator System',difficulty:'Hard',time:60,tags:['State','Strategy','Scheduling'],prompt:'Design an elevator system for a building with multiple elevators. Users can request an elevator from a floor and select a destination. The system should assign cars and support different scheduling policies.',req:['Multiple elevators can serve the same building.','Hall calls and cabin requests must be represented.','An elevator has current floor and direction/state.','Assignment/scheduling should be replaceable.','State transitions should have a clear owner.'],hints:['Separate request creation from assignment.','Model elevator state explicitly.','Scheduling policy is a natural variation point.']},
{id:'vending',title:'Vending Machine',difficulty:'Easy',time:30,tags:['State','Factory','Encapsulation'],prompt:'Design a vending machine that accepts money, lets users choose products, dispenses inventory and returns change. It should behave correctly for invalid selections and insufficient funds.',req:['Products have prices and inventory counts.','Machine accepts multiple denominations.','Selection fails safely when product is unavailable.','Machine returns change and resets the transaction.','Payment rules can evolve without rewriting inventory.'],hints:['Model the transaction lifecycle.','Consider State when behavior changes by machine phase.','Keep inventory separate from payment logic.']}];
let attempts=JSON.parse(localStorage.getItem('lld-attempts')||'[]'),cur=P[0],startTime=0,timer=null,hint=0;
function save(a){attempts=[a,...attempts.filter(x=>x.id!==a.id)];localStorage.setItem('lld-attempts',JSON.stringify(attempts))}
function home(){clearInterval(timer);app.innerHTML=`<main class="wrap"><section class="hero"><div><p class="eyebrow">LOW-LEVEL DESIGN PRACTICE</p><h1>Design systems.<br><i>Understand why they work.</i></h1><p class="lede">Practice interview-style LLD problems and get explainable feedback on responsibilities, abstractions, relationships and trade-offs.</p><button class="primary" onclick="practice(P[0])">▶ Start a practice</button></div><div class="loop"><div>THE PRACTICE LOOP</div><div>01 Choose a problem</div><div>02 Design your solution</div><div>03 Submit for review</div><div>04 Learn from feedback</div><div>05 Try again</div></div></section><section class="stats"><div><b>${attempts.length}</b><span>attempts</span></div><div><b>${attempts.length?Math.round(attempts.reduce((s,a)=>s+a.score,0)/attempts.length):'—'}</b><span>avg. score</span></div><div><b>6</b><span>evaluation signals</span></div></section><div class="section"><div><p class="eyebrow">PROBLEM LIBRARY</p><h2>Pick a system to design</h2></div><span>${P.length} focused problems</span></div><div class="cards">${P.map(p=>`<article class="card"><div class="top"><span class="diff ${p.difficulty.toLowerCase()}">${p.difficulty}</span><span>${p.time} min</span></div><h3>${p.title}</h3><p>${p.prompt}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div><button class="text" onclick="practice(P.find(x=>x.id==='${p.id}'))">Practice →</button></article>`).join('')}</div></main>`}
function practice(p){cur=p;hint=0;startTime=Date.now();clearInterval(timer);timer=setInterval(()=>{const e=Math.floor((Date.now()-startTime)/1000);document.querySelector('#timer').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0')},1000);app.innerHTML=`<main class="practice"><div class="phead"><button class="back" onclick="home()">← Problems</button><div><span class="diff ${p.difficulty.toLowerCase()}">${p.difficulty}</span><h1>${p.title}</h1></div><div id="timer" class="timer">00:00</div></div><div class="workspace"><aside class="aside"><p class="eyebrow">PROBLEM</p><p class="prompt">${p.prompt}</p><h4>Requirements</h4><ul>${p.req.map(x=>`<li>${x}</li>`).join('')}</ul><div class="hint"><b>💡 Hint <span id="hintNo">0</span>/${p.hints.length}</b><p id="hintText"></p><button onclick="reveal()">Reveal next hint</button></div></aside><section class="editor"><div class="etitle"><div><b>Your design</b><small> Explain the decisions, not just class names.</small></div><button class="submit" onclick="submitAttempt()">Submit for feedback</button></div>${field('requirements','1 · Requirements & assumptions','What is in scope? What assumptions are you making?')}${field('classes','2 · Classes & responsibilities','Example: ParkingLot coordinates operations; Floor owns spots...')}${field('relationships','3 · Relationships & abstractions','Composition, inheritance, interfaces, dependency direction...')}${field('behaviour','4 · Behaviour & edge cases','Walk through one happy path and at least two failure paths.')}${field('tradeoffs','5 · Trade-offs','What alternative did you reject and why?')}${field('code','6 · Optional code sketch','Pseudo-code or key interfaces. Keep it focused.')}</section></div></main>`}
function field(id,label,ph){return `<div class="field"><label>${label}</label><textarea id="${id}" placeholder="${ph}"></textarea></div>`}
function reveal(){if(hint<cur.hints.length){hint++;document.querySelector('#hintNo').textContent=hint;document.querySelector('#hintText').textContent=cur.hints[hint-1]}}
function evaluate(s){let all=Object.values(s).join('\n').toLowerCase(),items=[],filled=Object.values(s).filter(v=>v.trim().length>20).length;function add(c,se,t,d,a){items.push({c,se,t,d,a})}if(filled<4)add('Completeness','critical','Several sections are too thin','A meaningful LLD attempt needs responsibilities, relationships, behaviour and trade-offs.','Expand each section with concrete decisions and one example flow.');else add('Completeness','pass','Core design is present','The submission contains enough structured information to evaluate.','Keep the same structure for future attempts.');if(/interface|abstract|strategy|policy/.test(all))add('Abstraction','pass','A variation point is identified','You have introduced an abstraction for behavior that may change.','Explain why that interface owns the variation.');else add('Abstraction','warn','Variation points are not explicit','The prompt contains behavior that may change, but it is not isolated.','Add an interface such as Strategy/Policy where behavior varies.');if(/responsib|single responsibility|cohesion|god object/.test(all))add('Responsibilities','pass','Responsibilities are discussed','The design acknowledges responsibility boundaries.','Name the owner of each important behavior.');else add('Responsibilities','warn','Responsibility boundaries are unclear','Class lists alone do not show who owns behavior.','For each major class, state one responsibility and collaborator.');if(/composition|has-a|aggregation|owns/.test(all))add('Relationships','pass','Relationships consider ownership','The submission considers composition/ownership.','Clarify who creates, owns and releases each object.');else add('Relationships','warn','Relationships need more detail','The evaluator cannot tell which objects own or merely reference others.','Use phrases like “Floor owns Spot”.');if(/edge|invalid|failure|exception|reject/.test(all))add('Behaviour','pass','Failure paths are considered','The design includes non-happy-path behavior.','Add one concrete sequence for the hardest failure path.');else add('Behaviour','warn','Edge cases are missing','Interview-quality LLD should explain invalid requests and state transitions.','Add at least two failure/edge cases and their responsible class.');if(/trade|alternative|why /.test(s.tradeoffs.toLowerCase()))add('Trade-offs','pass','Trade-offs are stated','You explain decisions instead of presenting one design as universal.','Tie each trade-off to a requirement.');else add('Trade-offs','warn','Trade-offs are underdeveloped','LLD is evaluated on judgement as well as structure.','Name one alternative you rejected and why.');let score=Math.max(0,Math.min(100,Math.round(100-items.filter(x=>x.se==='critical').length*18-items.filter(x=>x.se==='warn').length*8+(filled>=5?8:0))));return{score,items,summary:score>=80?'Strong foundation. The design is structured enough to discuss in an interview.':score>=60?'Promising attempt. Tighten responsibilities, relationships and edge cases before repeating the problem.':'The attempt needs more concrete object behaviour before it can be evaluated confidently.'}}
function submitAttempt(){clearInterval(timer);let s={};['requirements','classes','relationships','behaviour','tradeoffs','code'].forEach(k=>s[k]=document.getElementById(k).value);let e=evaluate(s),a={id:Date.now(),problemId:cur.id,createdAt:new Date().toISOString(),submission:s,score:e.score,evaluation:e};save(a);feedback(a)}
function feedback(a){let e=a.evaluation;app.innerHTML=`<main class="wrap"><button class="back" onclick="practice(cur)">← Back to attempt</button><section class="scorehero"><div><p class="eyebrow">EVALUATION COMPLETE</p><h1>Feedback you can act on.</h1><p>${e.summary}</p></div><div class="score"><b>${e.score}</b>/ 100</div></section><div class="grid"><section><h2>Signals</h2>${e.items.map(x=>`<div class="fi"><div class="sig ${x.se}">${x.se==='pass'?'✓':'!'}</div><div><b>${x.t}</b><span style="font:10px monospace;color:#999"> · ${x.c}</span><p>${x.d}</p><small>Next: ${x.a}</small></div></div>`).join('')}</section><aside><div class="side"><p class="eyebrow">WHAT WORKED</p>${e.items.filter(x=>x.se==='pass').map(x=>`<div class="mini">✓ ${x.t}</div>`).join('')||'<div class="mini">Complete more sections to surface strengths.</div>'}</div><div class="side"><p class="eyebrow">NEXT ITERATION</p>${e.items.filter(x=>x.se!=='pass').map(x=>`<div class="mini">→ ${x.a}</div>`).join('')}</div><button class="primary" style="width:100%" onclick="practice(cur)">↻ Try ${cur.title} again</button></aside></div></main>`}
function historyView(){clearInterval(timer);app.innerHTML=`<main class="wrap"><div class="section"><div><p class="eyebrow">YOUR PRACTICE HISTORY</p><h1>Progress, not perfection.</h1></div></div>${attempts.length?`<div class="history">${attempts.map(a=>{let p=P.find(x=>x.id===a.problemId);return `<article><div><span class="diff ${p.difficulty.toLowerCase()}">${p.difficulty}</span><h3>${p.title}</h3><small>${new Date(a.createdAt).toLocaleString()}</small></div><b>${a.score}<small>/100</small></b><button class="text" onclick="cur=P.find(x=>x.id==='${p.id}');feedback(attempts.find(x=>x.id===${a.id}))">Review →</button></article>`}).join('')}</div>`:'<div class="empty">No attempts yet. Pick a problem and submit your first design.</div>'}</main>`}
home();
</script></body></html>
